# nginx settings for the React single-page app (SPA).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /chat, /logs, /evaluation ... are React routes, not real files.
    # If the file does not exist, send index.html and let React Router show the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files have a hash in their name, so browsers may cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
