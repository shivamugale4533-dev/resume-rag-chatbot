# CI/CD pipeline (GitHub Actions).
# Runs on every push and pull request to main:
#   1. backend  → install Python packages, run pytest (Gemini is mocked: no secrets needed)
#   2. frontend → npm ci, run tests, build the production bundle
#   3. docker   → build both Docker images, to prove the Dockerfiles work
# Deployment (CD): Render deploys the backend only after these checks pass
# (autoDeployTrigger: checksPass in render.yaml); Vercel deploys the frontend on push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]          # only build images if the tests passed
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t resume-backend ./backend
      - name: Build frontend image
        run: docker build -t resume-frontend ./frontend
      - name: Smoke test the backend container
        run: |
          docker run -d --name api -p 8000:8000 -e GEMINI_API_KEY=dummy resume-backend
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1

  # Optional: trigger a Render deploy through a deploy hook (only if the secret exists).
  # Use this OR Render's "After CI checks pass" auto-deploy setting, not both.
  deploy:
    name: Trigger Render deploy (optional)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Call the deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "Render deploy triggered"
      - name: No hook configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL not set; Render auto-deploys after checks pass."
